project:
  name: geluidsmeter
  description: "Lokaal geluidsprofiel bij vaste meetlocatie; publicatie via Portolan/STAC."
  quality_label: "prototype_indicatief_niet_juridisch"

measurement:
  interval_seconds: 1
  aggregate_seconds: 60
  sample_rate: 32000
  channels: 1
  device_name: "C922 Pro Stream Webcam"   # hw:0,0 — gedeeld met Derwisch ritueel.py
  store_raw_audio: false
  calibration_offset_db: 90.7  # dBFS → dB(A); gekalibreerd 2026-05-14 tov telefoon-SLM (ref=31 dB(A))

location:
  private_location_file: "core/location_private.yaml"
  publish_exact_location: false
  public_location_precision_m: 100
  public_name: "Archipelbuurt, Den Haag"
  public_id: "archipelbuurt-denhaag"
  crs: "EPSG:4326"

features:
  calculate_rms: true
  calculate_lmax: true
  calculate_frequency_bands: true
  bands_hz:
    low: [20, 250]
    mid: [250, 2000]
    high: [2000, 8000]
  detect_events: true
  peak_threshold_db_relative: 12
  low_freq_threshold_relative: 8

outputs:
  raw_features_dir: "/mnt/nvme/geluidsmeter/data/raw_features"
  processed_dir: "/mnt/nvme/geluidsmeter/data/processed"
  catalog_dir: "/mnt/nvme/geluidsmeter/data/catalog"
  external_dir: "/mnt/nvme/geluidsmeter/data/external"

api:
  host: "0.0.0.0"
  port: 8792   # 8791 bezet door felix-nazaten/upload_server.py

portolan:
  collection: "geluidsmeter"
  remote: ""   # leeg = alleen lokale catalogus in MVP

sources:
  wfs_bbox_m: 500             # bbox straal rond meetlocatie in meters
  force_refresh: false        # true = WFS opnieuw ophalen ook als data bestaat
  nwb_wfs_url: "https://service.pdok.nl/rws/nwbwegen/wfs/v1_0"
  bgt_ogcapi_url: "https://api.pdok.nl/lv/bgt/ogc/v1"
  geluidkaarten_wfs_url: "https://service.pdok.nl/ienw/geluidsbelastingkaarten-wegen-lden/wfs/v1_0"  # Sprint 4: endpoint nog niet beschikbaar via PDOK — normcheck werkt zonder

mobile:
  submit_token: "geluidsmeter-mobiel"   # verander dit naar een echt wachtwoord
  measurements_file: "/mnt/nvme/geluidsmeter/data/mobile_measurements.jsonl"

leefomgevinglab:
  cache_dir: "/mnt/nvme/geluidsmeter/data/cache"
  rev:
    ogc_base_url: "https://api.pdok.nl/rws/productie-en-industrie-productiefaciliteiten/ogc/v1"
    # Productiefaciliteiten zijn per sector over meerdere collections verdeeld;
    # de connector voegt ze samen en tagt elk object met property rev_sector.
    collections:
      - production_facility_c   # Productie
      - production_facility_h   # Transport en opslagdiensten
      - production_facility_e   # Watervoorziening, riolering, afvalbeheer, sanering
      - production_facility_d   # Stroom, gas, stoom, airco
      - production_facility_b   # Winning van delfstoffen
      - production_facility_f   # Bouw
    max_features: 500
  llm:
    base_url: "http://localhost:8080/v1"
    model: "qwen2.5-32b"
    timeout_s: 60
  viewer:
    center_lat: 51.885
    center_lon: 4.27
    zoom: 12
