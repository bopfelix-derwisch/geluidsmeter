project:
  name: geluidsmeter
  description: "Lokaal geluidsprofiel bij vaste meetlocatie; publicatie via Portolan/STAC."
  quality_label: "prototype_indicatief_niet_juridisch"

measurement:
  interval_seconds: 1
  aggregate_seconds: 60
  sample_rate: 32000
  channels: 1
  device_name: "C922 Pro Stream Webcam"   # hw:0,0 — gedeeld met Derwisch ritueel.py
  store_raw_audio: false
  calibration_offset_db: 90.7  # dBFS → dB(A); gekalibreerd 2026-05-14 tov telefoon-SLM (ref=31 dB(A))

location:
  private_location_file: "core/location_private.yaml"
  publish_exact_location: false
  public_location_precision_m: 100
  public_name: "Archipelbuurt, Den Haag"
  public_id: "archipelbuurt-denhaag"
  crs: "EPSG:4326"

features:
  calculate_rms: true
  calculate_lmax: true
  calculate_frequency_bands: true
  bands_hz:
    low: [20, 250]
    mid: [250, 2000]
    high: [2000, 8000]
  detect_events: true
  peak_threshold_db_relative: 12
  low_freq_threshold_relative: 8

outputs:
  raw_features_dir: "/mnt/nvme/geluidsmeter/data/raw_features"
  processed_dir: "/mnt/nvme/geluidsmeter/data/processed"
  catalog_dir: "/mnt/nvme/geluidsmeter/data/catalog"
  external_dir: "/mnt/nvme/geluidsmeter/data/external"

api:
  host: "0.0.0.0"
  port: 8792   # 8791 bezet door felix-nazaten/upload_server.py

portolan:
  collection: "geluidsmeter"
  remote: ""   # leeg = alleen lokale catalogus in MVP

sources:
  wfs_bbox_m: 500             # bbox straal rond meetlocatie in meters
  force_refresh: false        # true = WFS opnieuw ophalen ook als data bestaat
  nwb_wfs_url: "https://service.pdok.nl/rws/nwbwegen/wfs/v1_0"
  bgt_ogcapi_url: "https://api.pdok.nl/lv/bgt/ogc/v1"
  geluidkaarten_wfs_url: "https://service.pdok.nl/ienw/geluidsbelastingkaarten-wegen-lden/wfs/v1_0"  # Sprint 4: endpoint nog niet beschikbaar via PDOK — normcheck werkt zonder

mobile:
  submit_token: "geluidsmeter-mobiel"   # verander dit naar een echt wachtwoord
  measurements_file: "/mnt/nvme/geluidsmeter/data/mobile_measurements.jsonl"

leefomgevinglab:
  cache_dir: "/mnt/nvme/geluidsmeter/data/cache"
  rag:
    embed:
      base_url: "http://localhost:8082/v1"   # llama.cpp embedding-server (model laden, zie plan Task 3 Step 0)
      model: "bge-m3"
    store_dir: "/mnt/nvme/geluidsmeter/data/rag"
    top_k: 4
    chunk_chars: 1200
    chunk_overlap: 200
    # Curated IPLO-bronpagina's (geverifieerd 2026-06-21); vul aan met relevante URL's.
    iplo_urls:
      - "https://iplo.nl/regelgeving/instrumenten/omgevingsvergunning/"
      - "https://iplo.nl/regelgeving/regels-voor-activiteiten/"
  rev:
    ogc_base_url: "https://api.pdok.nl/rws/productie-en-industrie-productiefaciliteiten/ogc/v1"
    # Productiefaciliteiten zijn per sector over meerdere collections verdeeld;
    # de connector voegt ze samen en tagt elk object met property rev_sector.
    collections:
      - production_facility_c   # Productie
      - production_facility_h   # Transport en opslagdiensten
      - production_facility_e   # Watervoorziening, riolering, afvalbeheer, sanering
      - production_facility_d   # Stroom, gas, stoom, airco
      - production_facility_b   # Winning van delfstoffen
      - production_facility_f   # Bouw
    max_features: 500
  dso:
    # DSO Toepasbare Regels (pre-productie). Live geverifieerd 2026-06-22 met DSO_API_KEY.
    # Keys werken alleen op service.pre.* (productie geeft 401). Header x-api-key.
    # Geometrie in RD/EPSG:28992. Zie spec 2026-06-22-dso-regels-resolver-design.md.
    api_key_header: "x-api-key"
    zoek_base_url: "https://service.pre.omgevingswet.overheid.nl/publiek/toepasbare-regels/api/zoekinterface/v2"
    rtr_base_url: "https://service.pre.omgevingswet.overheid.nl/publiek/toepasbare-regels/api/samengestelderegistratietoepasbareregelsservices/v2"
    uitvoeren_base_url: "https://service.pre.omgevingswet.overheid.nl/publiek/toepasbare-regels/api/toepasbareregelsuitvoerenservices/v3"
  llm:
    base_url: "http://localhost:8080/v1"
    model: "qwen2.5-32b"
    timeout_s: 60
  semantiek:
    store_dir: "/mnt/nvme/geluidsmeter/data/semantiek"
    # Open IMX-Geo linked data (geen key). SKOS-conceptscheme = schone koppelingen;
    # MIM-export = rijker model. Geverifieerd 2026-06-21.
    ttl_urls:
      - "https://raw.githubusercontent.com/geonovum/IMX-Geo/main/conceptscheme/imxgeo-skos.ttl"
      - "https://raw.githubusercontent.com/geonovum/IMX-Geo/main/mim-ld-export/model/imx-geo-mim.ttl"
    # Vocab-JSON-bronnen (skos:Concept-lijsten met definitie). IMEV 3.0.x begrippen
    # externe veiligheid (Geonovum/imev). Geverifieerd 2026-06-21.
    vocab_json_urls:
      - "https://raw.githubusercontent.com/Geonovum/imev/main/informatiemodel/IMEV_vocab_export_DSO.json"
  ld:
    kkg_endpoint: "https://api.labs.kadaster.nl/datasets/kadaster/kkg/services/kkg/sparql"
    store_dir: "/mnt/nvme/geluidsmeter/data/ld"
    provincie: "Zuid-Holland"
    # Bevinding 2026-06-21: de open REV-OGC-laag heeft GEEN Seveso-vlag; Seveso komt uit de
    # BRZO-bron (risicokaart/P_BRZO, met gebruiksvoorwaarden). De LD-laag bevat daarom de
    # REV-productiefaciliteiten (klasse ll:REVProductiefaciliteit), niet specifiek Seveso.
    # Optioneel generiek property-filter (callable in build_rev_graph); null = alle features.
    filter_property: null
    filter_values: []
    # Nabijheid-straal (m) voor de datavraag "in de buurt van een school".
    nabijheid_straal_m: 500
  viewer:
    center_lat: 51.885
    center_lon: 4.27
    zoom: 12
