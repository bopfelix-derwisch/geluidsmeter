<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LeefomgevingLab — Semantische browser (3D)</title>
  <!-- Globale THREE (UMD) zodat three-spritetext z'n SpriteText kan bouwen -->
  <script src="https://unpkg.com/three@0.160.1/build/three.min.js"></script>
  <script src="https://unpkg.com/3d-force-graph@1.73.4/dist/3d-force-graph.min.js"></script>
  <script src="https://unpkg.com/three-spritetext@1.10.0/dist/three-spritetext.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #080c14; color: #e0e6ed; overflow: hidden; }
    header { background: #0d1b2a; border-bottom: 1px solid #1a3a5c; padding: 10px 16px;
      display: flex; align-items: center; gap: 12px; flex-wrap: wrap; position: relative; z-index: 5; }
    header a { color: #2ecc8f; font-size: 13px; }
    header input { margin-left: auto; padding: 6px 10px; border-radius: 8px; border: 1px solid #1a3a5c;
      background: #0a1220; color: #e0e6ed; font-size: 13px; min-width: 160px; }
    #graph { position: absolute; top: 49px; bottom: 0; left: 0; right: 340px; background: #080c14; }
    #panel { position: absolute; top: 49px; bottom: 0; right: 0; width: 340px; overflow-y: auto;
      background: #0a1220; border-left: 1px solid #1a3a5c; padding: 14px; font-size: 13px; z-index: 5; }
    h3 { color: #eafff6; font-size: 14px; margin: 0 0 6px; }
    .lbl { font-size: 11px; text-transform: uppercase; letter-spacing: .6px; color: #5b7385; margin: 14px 0 6px; }
    .muted { color: #8aa0b2; font-size: 12px; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip { font-size: 11px; padding: 4px 9px; border-radius: 12px; cursor: pointer;
      border: 1px solid #1a3a5c; color: #8aa0b2; background: transparent; }
    .chip:hover { border-color: #2ecc8f; color: #2ecc8f; }
    .chip.active { background: #14323f; border-color: #2ecc8f; color: #2ecc8f; }
    .legend span { display: inline-flex; align-items: center; gap: 5px; margin: 2px 8px 2px 0; font-size: 11px; color: #8aa0b2; }
    .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
    #objlist { max-height: 230px; overflow-y: auto; border: 1px solid #14202e; border-radius: 8px; }
    .obj { padding: 5px 9px; cursor: pointer; border-bottom: 1px solid #0e1a26; }
    .obj:hover { background: #112233; }
    .obj .b { font-size: 9px; color: #5b7385; margin-left: 6px; }
    .objgroup { font-size: 10px; text-transform: uppercase; letter-spacing: .5px; color: #5b7385;
      padding: 5px 9px; background: #0c1722; position: sticky; top: 0; }
    .buur { border-top: 1px solid #14202e; padding: 6px 0; }
    .buur b { color: #4fc3f7; }
    .back { color: #2ecc8f; cursor: pointer; font-size: 12px; }
    .hint { position: absolute; left: 12px; bottom: 10px; font-size: 11px; color: #5b7385; z-index: 5;
      background: rgba(8,12,20,.7); padding: 4px 8px; border-radius: 6px; }
    @media (max-width: 720px) {
      header input { margin-left: 0; width: 100%; }
      body { display: flex; flex-direction: column; height: 100vh; }
      #graph { position: relative; inset: auto; flex: 1 1 52%; min-height: 0; }
      #panel { position: relative; inset: auto; width: auto; flex: 1 1 48%;
               border-left: none; border-top: 1px solid #1a3a5c; }
      .hint { display: none; }
    }
  </style>
</head>
<body>
  <header>
    <a href="/">← LeefomgevingLab</a>
    <strong style="color:#2ecc8f">Semantische browser</strong>
    <button id="demoBtn" style="padding:6px 12px;border:none;border-radius:8px;background:linear-gradient(135deg,#2ecc8f,#26a69a);color:#042;font-weight:700;cursor:pointer;font-size:13px">▶ Demo: informatievraag</button>
    <input id="zoek" placeholder="filter objecten…" />
  </header>
  <div id="graph"></div>
  <div class="hint">Sleep om te draaien · scroll/knijp om te zoomen</div>
  <div id="demo" style="display:none; position:absolute; left:16px; bottom:16px; right:356px; max-width:560px;
       background:rgba(13,27,42,.96); border:1px solid #2ecc8f; border-radius:10px; padding:14px 16px; z-index:9;">
    <div style="font-size:11px; text-transform:uppercase; letter-spacing:.6px; color:#2ecc8f" id="demoStep"></div>
    <h3 id="demoTitle" style="margin:4px 0 6px"></h3>
    <p id="demoText" style="font-size:13px; color:#cfd8dc; line-height:1.6"></p>
    <div style="margin-top:10px; display:flex; gap:8px; align-items:center">
      <button id="demoPrev" style="padding:5px 12px;border:1px solid #1a3a5c;border-radius:8px;background:transparent;color:#8aa0b2;cursor:pointer">‹ Vorige</button>
      <button id="demoNext" style="padding:5px 12px;border:none;border-radius:8px;background:#2ecc8f;color:#042;font-weight:700;cursor:pointer">Volgende ›</button>
      <span style="flex:1"></span>
      <button id="demoClose" style="padding:5px 10px;border:none;border-radius:8px;background:transparent;color:#8aa0b2;cursor:pointer">Sluiten ✕</button>
    </div>
  </div>
  <div id="panel">
    <div class="lbl">Doorsnede</div>
    <div id="doorsnedes" class="chips"></div>

    <div class="lbl">Object kiezen</div>
    <div id="objlist"><p class="muted" style="padding:8px">Laden…</p></div>

    <div class="lbl">Details</div>
    <div id="info"><p class="muted">Kies een doorsnede of een object.</p></div>

    <div class="lbl">Legenda</div>
    <div id="legend" class="legend"></div>
  </div>

  <script>
    const palette = ["#2ecc8f","#4fc3f7","#ffb74d","#e57373","#ba68c8","#a1887f","#90a4ae","#80cbc4","#f06292"];
    const bronColor = {};
    function colorFor(b) {
      if (!(b in bronColor)) bronColor[b] = palette[Object.keys(bronColor).length % palette.length];
      return bronColor[b];
    }
    const CROSS = new Set(["begrip", "closeMatch", "exactMatch", "gelijkeNaam"]);

    let nodesById = {};      // id -> stabiel node-object {id,label,bron}
    let linksRaw = [];       // {s,t,relatie}
    let adj = {};            // id -> [{other, relatie, out}]
    let bronnen = [];

    const el = document.getElementById("graph");
    let didFit = false;
    const Graph = ForceGraph3D({ controlType: "orbit" })(el)
      .backgroundColor("#080c14")
      .nodeColor(n => colorFor(n.bron))
      .nodeRelSize(4)
      .nodeThreeObjectExtend(true)
      .nodeThreeObject(node => {
        try {
          if (typeof SpriteText !== "function") return null;
          const s = new SpriteText(node.label);
          s.color = colorFor(node.bron); s.textHeight = 6;
          s.backgroundColor = "rgba(8,12,20,0.65)"; s.padding = 2; s.borderRadius = 3; s.position.y = 7;
          return s;
        } catch (e) { return null; }
      })
      .nodeLabel(n => `${n.label} — ${n.bron}`)
      .linkColor(() => "#3a5571").linkWidth(0.5).linkOpacity(0.5)
      .linkDirectionalArrowLength(2.5).linkDirectionalArrowRelPos(1)
      .linkDirectionalParticles(2).linkDirectionalParticleWidth(1.4).linkDirectionalParticleSpeed(0.006)
      .linkLabel(l => l.relatie)
      .onNodeClick(node => focusNode(node.id, 1))
      .onEngineStop(() => { if (!didFit) { didFit = true; Graph.zoomToFit(500, 25); } });

    Graph.d3Force("charge").strength(-16);
    Graph.d3Force("link").distance(14).strength(1.6);
    Graph.d3VelocityDecay(0.35);

    const controls = Graph.controls();
    controls.autoRotate = true; controls.autoRotateSpeed = 0.5;
    ["pointerdown", "wheel"].forEach(ev => el.addEventListener(ev, () => { controls.autoRotate = false; }, { passive: true }));
    function fitSize() { Graph.width(el.clientWidth).height(el.clientHeight); }
    window.addEventListener("resize", fitSize);

    function setData(idset) {
      const nodes = [...idset].map(id => nodesById[id]).filter(Boolean);
      const links = linksRaw.filter(l => idset.has(l.s) && idset.has(l.t))
                            .map(l => ({ source: l.s, target: l.t, relatie: l.relatie }));
      fitSize(); didFit = false;
      Graph.graphData({ nodes, links });
    }

    // ── Doorsnedes ──────────────────────────────────────────────
    function doorsnedeCross() {
      const ids = new Set();
      linksRaw.forEach(l => { if (CROSS.has(l.relatie)) { ids.add(l.s); ids.add(l.t); } });
      setTitle("Cross-model koppelingen", `${ids.size} begrippen die modellen verbinden`);
      setData(ids);
    }
    function doorsnedeAll() {
      setTitle("Volledig netwerk", `${Object.keys(nodesById).length} begrippen`);
      setData(new Set(Object.keys(nodesById)));
    }
    function doorsnedeBron(bron) {
      const ids = new Set();
      Object.values(nodesById).forEach(n => { if (n.bron === bron) ids.add(n.id); });
      // directe buren erbij zodat je ziet waar de bron aan koppelt
      linksRaw.forEach(l => { if (ids.has(l.s)) ids.add(l.t); if (ids.has(l.t)) ids.add(l.s); });
      setTitle("Doorsnede: " + bron, `${bron} + directe koppelingen`);
      setData(ids);
    }
    function setTitle(t, sub) {
      document.getElementById("info").innerHTML = `<h3>${t}</h3><p class="muted">${sub}</p>`;
    }
    function markActive(key) {
      document.querySelectorAll("#doorsnedes .chip").forEach(c =>
        c.classList.toggle("active", c.dataset.k === key));
    }

    function renderDoorsnedes() {
      const wrap = document.getElementById("doorsnedes");
      const items = [["cross", "Cross-model"], ["all", "Volledig"]].concat(bronnen.map(b => ["bron:" + b, b]));
      wrap.innerHTML = items.map(([k, lab]) => `<span class="chip" data-k="${k}">${lab}</span>`).join("");
      wrap.querySelectorAll(".chip").forEach(c => c.onclick = () => {
        markActive(c.dataset.k);
        if (c.dataset.k === "cross") doorsnedeCross();
        else if (c.dataset.k === "all") doorsnedeAll();
        else doorsnedeBron(c.dataset.k.slice(5));
      });
    }

    // ── Object kiezen → ego-netwerk ─────────────────────────────
    function egoIds(uri, diepte) {
      const ids = new Set([uri]);
      let frontier = [uri];
      for (let d = 0; d < diepte; d++) {
        const next = [];
        frontier.forEach(id => (adj[id] || []).forEach(e => { if (!ids.has(e.other)) { ids.add(e.other); next.push(e.other); } }));
        frontier = next;
      }
      return ids;
    }
    function focusNode(uri, diepte) {
      markActive("");
      setData(egoIds(uri, diepte));
      showDetail(uri, diepte);
      const n = (Graph.graphData().nodes || []).find(x => x.id === uri);
      if (n && n.x !== undefined) {
        const r = 1 + 90 / Math.max(1, Math.hypot(n.x, n.y, n.z || 1));
        Graph.cameraPosition({ x: n.x * r, y: n.y * r, z: n.z * r }, n, 700);
      }
    }
    function showDetail(uri, diepte) {
      const n = nodesById[uri];
      if (!n) return;
      const esc = s => (s || "").replace(/</g, "&lt;");
      const buren = (adj[uri] || []).map(e =>
        `<div class="buur"><b>${esc(e.relatie)}</b> ${e.out ? "→" : "←"} <span class="objlink" data-id="${esc(e.other)}" style="color:#4fc3f7;cursor:pointer">${esc(nodesById[e.other] ? nodesById[e.other].label : e.other)}</span> <span class="muted">(${esc(nodesById[e.other] ? nodesById[e.other].bron : "?")})</span></div>`).join("");
      document.getElementById("info").innerHTML =
        `<h3>${esc(n.label)}</h3><p class="muted">bron: ${esc(n.bron)} · ego-netwerk diepte ${diepte}</p>` +
        (n.definitie ? `<p>${esc(n.definitie)}</p>` : "") +
        `<p style="margin:6px 0"><span class="back" id="d1">diepte 1</span> · <span class="back" id="d2">diepte 2</span></p>` +
        (buren ? `<div class="lbl">Koppelingen (${(adj[uri] || []).length})</div>${buren}` : '<p class="muted">Geen koppelingen.</p>');
      document.getElementById("d1").onclick = () => focusNode(uri, 1);
      document.getElementById("d2").onclick = () => focusNode(uri, 2);
      document.querySelectorAll("#info .objlink").forEach(a => a.onclick = () => focusNode(a.dataset.id, 1));
    }

    function renderObjectList(filter) {
      const f = (filter || "").toLowerCase();
      const groups = {};
      Object.values(nodesById).forEach(n => {
        if (f && !n.label.toLowerCase().includes(f)) return;
        (groups[n.bron] = groups[n.bron] || []).push(n);
      });
      const html = bronnen.filter(b => groups[b]).map(b => {
        const items = groups[b].sort((a, c) => a.label.localeCompare(c.label)).map(n =>
          `<div class="obj" data-id="${n.id.replace(/"/g, "&quot;")}">${n.label.replace(/</g, "&lt;")}<span class="b">${b}</span></div>`).join("");
        return `<div class="objgroup">${b} (${groups[b].length})</div>${items}`;
      }).join("");
      const box = document.getElementById("objlist");
      box.innerHTML = html || '<p class="muted" style="padding:8px">Geen objecten.</p>';
      box.querySelectorAll(".obj").forEach(o => o.onclick = () => focusNode(o.dataset.id, 1));
    }

    function renderLegend() {
      document.getElementById("legend").innerHTML = bronnen.map(b =>
        `<span><span class="dot" style="background:${colorFor(b)}"></span>${b}</span>`).join("");
    }

    async function init() {
      let data;
      try { data = await (await fetch("/api/semantiek/graph")).json(); }
      catch (e) { document.getElementById("info").innerHTML = '<p class="muted">Netwerk niet beschikbaar.</p>'; return; }
      if (!data.beschikbaar) {
        document.getElementById("info").innerHTML =
          '<p class="muted">Nog geen graaf gebouwd. Draai <code>scripts/09_build_semantiek_graph.py</code>.</p>';
        return;
      }
      bronnen = (data.bronnen || []).slice();
      bronnen.forEach(colorFor);
      nodesById = {};
      data.elements.nodes.forEach(n => { nodesById[n.data.id] = { id: n.data.id, label: n.data.label, bron: n.data.bron, definitie: n.data.definitie }; });
      linksRaw = data.elements.edges.map(e => ({ s: e.data.source, t: e.data.target, relatie: e.data.relatie }));
      adj = {};
      linksRaw.forEach(l => {
        (adj[l.s] = adj[l.s] || []).push({ other: l.t, relatie: l.relatie, out: true });
        (adj[l.t] = adj[l.t] || []).push({ other: l.s, relatie: l.relatie, out: false });
      });
      renderDoorsnedes(); renderObjectList(""); renderLegend();
      markActive("cross"); doorsnedeCross();   // startbeeld
    }

    // ── Demo: hoe helpt semantiek een informatievraag beantwoorden ──
    function findId(bron, labelSub) {
      const s = labelSub.toLowerCase();
      const hit = Object.values(nodesById).find(n => n.bron === bron && n.label.toLowerCase().includes(s));
      return hit ? hit.id : null;
    }
    const demoSteps = [
      { t: "De informatievraag",
        h: "Is dit gebouw 'kwetsbaar' voor externe veiligheid?",
        x: "Stel: je wilt van een <b>gebouw</b> weten of het kwetsbaar is in het kader van externe veiligheid. Welke begrippen en registers heb je nodig — en bedoelen ze hetzelfde? De semantiek maakt dat zichtbaar. We starten bij de cross-model koppelingen.",
        run: () => { markActive("cross"); doorsnedeCross(); } },
      { t: "Stap 1 — 'Gebouw' in IMX-Geo",
        h: "Wat is een gebouw, volgens de basismodellen?",
        x: "We kiezen het objecttype <b>Gebouw</b> (IMX-Geo). Je ziet zijn ego-netwerk: het verwijst via <b>begrip</b> naar de <b>NEN3610</b>-definitie van 'gebouw', is een <b>supertype</b> van Bouwwerk, en hangt via een <b>associatie</b> aan Adres.",
        run: () => { const id = findId("IMX-Geo", "gebouw"); if (id) focusNode(id, 1); } },
      { t: "Stap 2 — Harmonisatie",
        h: "Bedoelen BAG/IMX-Geo hetzelfde 'gebouw'?",
        x: "Omdat IMX-Geo via <b>mim:begrip</b> naar de gedeelde NEN3610-definitie wijst, weet je dat 'gebouw' over de basisregistraties heen hetzelfde betekent. Dáárom kun je gebouw-data betrouwbaar koppelen. (Diepte 2 toont ook de buren-van-buren.)",
        run: () => { const id = findId("IMX-Geo", "gebouw"); if (id) focusNode(id, 2); } },
      { t: "Stap 3 — Externe veiligheid (IMEV)",
        h: "Kent het veiligheidsmodel 'kwetsbaar gebouw'?",
        x: "IMEV (externe veiligheid) kent <b>kwetsbaargebouw</b>. Maar let op: dit begrip zit in een <b>aparte IMEV-cluster</b> met eigen relaties — er is géén open koppeling naar het IMX-Geo/NEN3610-'gebouw'.",
        run: () => { const id = findId("IMEV", "kwetsbaargebouw") || findId("IMEV", "gebouw"); if (id) focusNode(id, 1); } },
      { t: "Stap 4 — De stelsel-gap",
        h: "Hier raakt je vraag een gat in het stelsel",
        x: "Om 'gebouw' (basisregistraties) aan 'kwetsbaargebouw' (externe veiligheid) te verbinden, mis je in de open data de brug. Die relatie ligt in de <b>Stelselcatalogus</b> — afgeschermd achter een DSO-key. Het netwerk maakt dat gat zélf zichtbaar.",
        run: () => { markActive("cross"); doorsnedeCross(); } },
      { t: "Conclusie",
        h: "Wat heeft de semantiek opgeleverd?",
        x: "De semantiek beantwoordt de vraag deels — ze toont wélke begrippen bestaan en dat 'gebouw' geharmoniseerd is (NEN3610) — én ze maakt zichtbaar wáár het stelsel nog werk vergt (IMEV ↔ basisregistraties). Precies wat je in een leerproject wilt zien: betekenis én lacunes.",
        run: () => { const id = findId("IMX-Geo", "gebouw"); if (id) focusNode(id, 2); } },
    ];
    let demoI = 0;
    function runDemo(i) {
      demoI = Math.max(0, Math.min(demoSteps.length - 1, i));
      const s = demoSteps[demoI];
      document.getElementById("demo").style.display = "block";
      document.getElementById("demoStep").textContent = `Stap ${demoI + 1} / ${demoSteps.length}`;
      document.getElementById("demoTitle").textContent = s.h;
      document.getElementById("demoText").innerHTML = s.x;
      document.getElementById("demoPrev").style.visibility = demoI === 0 ? "hidden" : "visible";
      document.getElementById("demoNext").textContent = demoI === demoSteps.length - 1 ? "Klaar" : "Volgende ›";
      controls.autoRotate = false;
      try { s.run(); } catch (e) {}
    }
    document.getElementById("demoBtn").onclick = () => runDemo(0);
    document.getElementById("demoPrev").onclick = () => runDemo(demoI - 1);
    document.getElementById("demoNext").onclick = () => { if (demoI === demoSteps.length - 1) document.getElementById("demo").style.display = "none"; else runDemo(demoI + 1); };
    document.getElementById("demoClose").onclick = () => { document.getElementById("demo").style.display = "none"; };

    let t;
    document.getElementById("zoek").addEventListener("input", e => {
      clearTimeout(t); t = setTimeout(() => renderObjectList(e.target.value.trim()), 250);
    });
    init();
  </script>
</body>
</html>
