<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LeefomgevingLab — Semantische browser (3D)</title>
  <script src="https://unpkg.com/3d-force-graph@1.73.4/dist/3d-force-graph.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #080c14; color: #e0e6ed; overflow: hidden; }
    header { background: #0d1b2a; border-bottom: 1px solid #1a3a5c; padding: 10px 16px;
      display: flex; align-items: center; gap: 12px; flex-wrap: wrap; position: relative; z-index: 5; }
    header a { color: #2ecc8f; font-size: 13px; }
    header input { margin-left: auto; padding: 6px 10px; border-radius: 8px; border: 1px solid #1a3a5c;
      background: #0a1220; color: #e0e6ed; font-size: 13px; }
    #graph { position: absolute; top: 49px; bottom: 0; left: 0; right: 320px; background: #080c14; }
    #panel { position: absolute; top: 49px; bottom: 0; right: 0; width: 320px; overflow-y: auto;
      background: #0a1220; border-left: 1px solid #1a3a5c; padding: 14px; font-size: 13px; z-index: 5; }
    #panel h3 { color: #eafff6; font-size: 15px; margin-bottom: 6px; }
    .muted { color: #8aa0b2; font-size: 12px; }
    .legend span { display: inline-flex; align-items: center; gap: 5px; margin: 2px 8px 2px 0; font-size: 11px; color: #8aa0b2; }
    .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
    .buur { border-top: 1px solid #14202e; padding: 6px 0; }
    .buur b { color: #4fc3f7; }
    .hint { position: absolute; left: 12px; bottom: 10px; font-size: 11px; color: #5b7385; z-index: 5;
      background: rgba(8,12,20,.7); padding: 4px 8px; border-radius: 6px; }
    @media (max-width: 720px) {
      header .muted { display: none; }
      header input { margin-left: 0; width: 100%; }
      body { display: flex; flex-direction: column; height: 100vh; }
      #graph { position: relative; inset: auto; flex: 1 1 58%; min-height: 0; }
      #panel { position: relative; inset: auto; width: auto; flex: 1 1 42%;
               border-left: none; border-top: 1px solid #1a3a5c; }
      .hint { display: none; }
    }
  </style>
</head>
<body>
  <header>
    <a href="/">← LeefomgevingLab</a>
    <strong style="color:#2ecc8f">Semantische browser</strong>
    <span class="muted">IMX-Geo + IMEV · 3D-koppelingennetwerk</span>
    <input id="zoek" placeholder="zoek begrip…" />
  </header>
  <div id="graph"></div>
  <div class="hint">Sleep om te draaien · scroll/knijp om te zoomen · klik een begrip</div>
  <div id="panel">
    <div id="legend" class="legend"></div>
    <hr style="border-color:#14202e; margin:10px 0" />
    <div id="info"><p class="muted">Klik een begrip in het netwerk.</p></div>
  </div>
  <script>
    const palette = ["#2ecc8f","#4fc3f7","#ffb74d","#e57373","#ba68c8","#a1887f","#90a4ae"];
    const bronColor = {};
    function colorFor(bron) {
      if (!(bron in bronColor)) bronColor[bron] = palette[Object.keys(bronColor).length % palette.length];
      return bronColor[bron];
    }
    function renderLegend(bronnen) {
      document.getElementById("legend").innerHTML = (bronnen || []).map(b =>
        `<span><span class="dot" style="background:${colorFor(b)}"></span>${b}</span>`).join("");
    }

    const el = document.getElementById("graph");
    const Graph = ForceGraph3D()(el)
      .backgroundColor("#080c14")
      .nodeLabel(n => `${n.label} — ${n.bron}`)
      .nodeColor(n => colorFor(n.bron))
      .nodeOpacity(0.95)
      .nodeRelSize(4)
      .linkColor(() => "#2a4258")
      .linkWidth(0.6)
      .linkOpacity(0.5)
      .linkDirectionalParticles(2)
      .linkDirectionalParticleWidth(1.6)
      .linkDirectionalParticleSpeed(0.006)
      .onNodeClick(node => {
        const ratio = 1 + 110 / Math.max(1, Math.hypot(node.x || 1, node.y || 1, node.z || 1));
        Graph.cameraPosition({ x: node.x * ratio, y: node.y * ratio, z: node.z * ratio }, node, 800);
        showNode(node.id);
      });

    function fitSize() { Graph.width(el.clientWidth).height(el.clientHeight); }
    window.addEventListener("resize", fitSize);

    async function load(zoekTerm) {
      const url = "/api/semantiek/graph" + (zoekTerm ? "?zoekTerm=" + encodeURIComponent(zoekTerm) : "");
      let data;
      try { const r = await fetch(url); data = await r.json(); }
      catch (e) { document.getElementById("info").innerHTML = '<p class="muted">Netwerk niet beschikbaar.</p>'; return; }
      if (!data.beschikbaar) {
        document.getElementById("info").innerHTML =
          '<p class="muted">Nog geen graaf gebouwd. Draai <code>scripts/09_build_semantiek_graph.py</code>.</p>';
        return;
      }
      (data.bronnen || []).forEach(colorFor);
      renderLegend(data.bronnen || []);
      const nodes = data.elements.nodes.map(n => ({ id: n.data.id, label: n.data.label, bron: n.data.bron }));
      const links = data.elements.edges.map(e => ({ source: e.data.source, target: e.data.target, relatie: e.data.relatie }));
      fitSize();
      Graph.graphData({ nodes, links });
    }

    async function showNode(uri) {
      const info = document.getElementById("info");
      info.innerHTML = "Bezig…";
      try {
        const r = await fetch("/api/semantiek/node?uri=" + encodeURIComponent(uri));
        if (!r.ok) throw new Error();
        const d = await r.json();
        const n = d.node.data;
        const esc = s => (s || "").replace(/</g, "&lt;");
        const buren = (d.buren || []).map(b =>
          `<div class="buur"><b>${esc(b.relatie)}</b> → ${esc(b.node.data.label)} <span class="muted">(${esc(b.node.data.bron)})</span></div>`).join("");
        info.innerHTML = `<h3>${esc(n.label)}</h3>` +
          `<p class="muted">bron: ${esc(n.bron)}</p>` +
          (n.definitie ? `<p>${esc(n.definitie)}</p>` : "") +
          `<p class="muted" style="margin-top:8px; word-break:break-all">${esc(n.id)}</p>` +
          (buren ? `<h3 style="font-size:13px;margin-top:12px">Koppelingen (${d.buren.length})</h3>${buren}` : "");
      } catch (e) { info.innerHTML = '<p class="muted">Kon begrip niet laden.</p>'; }
    }

    let t;
    document.getElementById("zoek").addEventListener("input", (e) => {
      clearTimeout(t);
      t = setTimeout(() => load(e.target.value.trim()), 350);
    });
    load("");
  </script>
</body>
</html>
