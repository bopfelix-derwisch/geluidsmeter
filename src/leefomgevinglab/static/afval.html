<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Afval &amp; circulariteit — LeefomgevingLab</title>
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
  * { box-sizing: border-box; }
  :root {
    --bg: #080c14; --panel: #0d1b2a; --panel2: #0a1220; --border: #1a3a5c;
    --accent: #2ecc8f; --accent2: #26a69a; --text: #e0e6ed; --muted: #8aa0b2; --dim: #5b7385;
  }
  body { margin: 0; height: 100vh; display: flex; flex-direction: column;
    background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; }
  a { color: inherit; text-decoration: none; }

  header { background: var(--panel); border-bottom: 1px solid var(--border);
    padding: 12px 20px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  header .mark { width: 22px; height: 22px; border-radius: 6px;
    background: linear-gradient(135deg, var(--accent), var(--accent2)); flex: none; }
  header h1 { font-size: 15px; color: var(--accent); white-space: nowrap; font-weight: 700; }
  .badge { font-size: 10px; padding: 2px 9px; border-radius: 10px; white-space: nowrap;
    border: 1px solid var(--border); color: var(--muted); }
  header nav { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; }
  header nav a { font-size: 12px; color: var(--muted); padding: 4px 10px; border-radius: 12px; border: 1px solid transparent; }
  header nav a:hover { border-color: var(--border); color: var(--accent); }
  .subbar { padding: 6px 20px; background: var(--panel2); border-bottom: 1px solid var(--border);
    font-size: 12px; color: var(--muted); }

  .wrap { flex: 1; display: flex; min-height: 0; }
  aside.left { width: 300px; padding: 14px; overflow-y: auto; border-right: 1px solid var(--border);
    background: var(--panel); display: flex; flex-direction: column; }
  aside { width: 340px; padding: 14px; overflow-y: auto; border-left: 1px solid var(--border); background: var(--panel); }
  aside.left h2, .chat h2 { font-size: 12px; text-transform: uppercase; letter-spacing: 1px; margin: 0 0 8px; color: var(--dim); }
  .bronitem { font-size: 12px; margin-bottom: 10px; }
  .bronitem b { color: #eafff6; }
  .bronitem .lic { color: var(--dim); }
  .bronitem a { color: #4fc3f7; }
  .chat { margin-top: 16px; display: flex; flex-direction: column; flex: 1; min-height: 220px; }
  #chatlog { flex: 1; overflow-y: auto; border: 1px solid var(--border); border-radius: 8px; padding: 8px;
    font-size: 13px; background: var(--panel2); }
  #chatlog .q { font-weight: 600; margin-top: 8px; color: var(--accent); }
  #chatlog .a { white-space: pre-wrap; margin: 2px 0 4px; }
  #chatlog details { font-size: 11px; color: var(--muted); }
  #chatlog pre { white-space: pre-wrap; background: #04140d; color: var(--text); padding: 6px; border-radius: 4px; }
  #chatlog .lic { color: var(--dim); }
  .chatbar { display: flex; gap: 6px; margin-top: 8px; }
  .chatbar input { flex: 1; padding: 7px 8px; background: var(--panel2); color: var(--text);
    border: 1px solid var(--border); border-radius: 6px; }
  .chatbar input::placeholder { color: var(--dim); }
  #map { flex: 1; }
  label { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .5px; margin: 12px 0 3px; color: var(--muted); }
  select { width: 100%; padding: 7px; background: var(--panel2); color: var(--text); border: 1px solid var(--border); border-radius: 6px; }
  .legend { margin-top: 14px; font-size: 12px; color: var(--muted); }
  .legend i { display: inline-block; width: 14px; height: 14px; margin-right: 6px; vertical-align: middle; border-radius: 2px; }
  #trend { margin-top: 16px; }
  #trend h3 { font-size: 14px; margin: 8px 0; color: #eafff6; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th, td { border-bottom: 1px solid var(--border); padding: 4px 5px; text-align: right; }
  th { color: var(--dim); font-weight: 600; }
  th:first-child, td:first-child { text-align: left; }
  button { margin-top: 10px; padding: 8px 12px; border: 0; border-radius: 6px; cursor: pointer;
    font-weight: 700; color: #042; background: linear-gradient(135deg, var(--accent), var(--accent2)); }
  button:hover { filter: brightness(1.08); }
  .bron { margin-top: 16px; font-size: 11px; color: var(--dim); }
  #trend button { width: 100%; }
  @media (max-width: 900px) { .wrap { flex-direction: column; } body { height: auto; }
    aside.left, aside { width: auto; border: 0; border-bottom: 1px solid var(--border); } #map { height: 60vh; } }

  /* Centrale AI-duiding-modal */
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.6);
    display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 20px; }
  .modal-overlay[hidden] { display: none; }
  .modal-card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; max-width: 560px; width: 100%;
    max-height: 88vh; overflow-y: auto; padding: 22px 24px; box-shadow: 0 18px 50px rgba(0,0,0,.5); position: relative; color: var(--text); }
  .modal-card h2 { margin: 0 28px 4px 0; font-size: 19px; color: var(--accent); }
  .modal-card .sub { font-size: 12px; color: var(--dim); margin-bottom: 14px; }
  .modal-close { position: absolute; top: 12px; right: 14px; background: none; color: var(--muted);
    border: 0; font-size: 26px; line-height: 1; cursor: pointer; padding: 0; margin: 0; }
  .stats { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 13px; margin-bottom: 14px; }
  .stats dt { color: var(--muted); font-weight: 600; }
  .stats dd { margin: 0; text-align: left; color: var(--text); }
  .duiding-text { font-size: 14px; line-height: 1.5; background: var(--panel2); border-left: 3px solid var(--accent);
    padding: 12px 14px; border-radius: 6px; white-space: pre-wrap; min-height: 40px; }
  .modal-bron { margin-top: 12px; font-size: 11px; color: var(--dim); }
</style>
</head>
<body>
<header>
  <div class="mark"></div>
  <h1>LeefomgevingLab</h1>
  <span class="badge">Afval &amp; circulariteit</span>
  <nav>
    <a href="/">Home</a>
    <a href="/viewer">REV-viewer</a>
    <a href="/chatbot">Chatbot</a>
    <a href="/datavraag">Datavraag</a>
    <a href="/semantiek">Semantiek</a>
    <a href="/public">Geluidsmeter</a>
    <a href="/roadmap">Roadmap</a>
  </nav>
</header>
<div class="subbar" id="bron">Laden…</div>
<div class="wrap">
  <aside class="left">
    <h2>Brondata</h2>
    <div style="font-size:12px;color:#8aa0b2;margin-bottom:8px">Deze cijfers komen uit open bronnen:</div>
    <div id="bronnen">Laden…</div>
    <div class="chat">
      <h2>Vraag het de data</h2>
      <div id="chatlog"></div>
      <div class="chatbar">
        <input id="chatinput" placeholder="bijv. hoeveel GFT in Flevoland in 2020?" />
        <button id="chatsend">Vraag</button>
      </div>
    </div>
  </aside>
  <div id="map"></div>
  <aside>
    <label>Afvalstroom</label>
    <select id="afvalstroom"></select>
    <label>Jaar</label>
    <select id="jaar"></select>
    <label>Indicator</label>
    <select id="indicator">
      <option value="volume">Hoeveelheid (kton)</option>
      <option value="circulariteit">Circulariteit (%)</option>
    </select>
    <div class="legend" id="legend"></div>
    <div id="trend"><h3>Klik op een provincie</h3></div>
    <div class="bron" id="licentie"></div>
  </aside>
</div>

<div id="modal" class="modal-overlay" hidden>
  <div class="modal-card">
    <button class="modal-close" id="modalClose" aria-label="Sluiten">&times;</button>
    <h2 id="modalTitle"></h2>
    <div class="sub" id="modalSub"></div>
    <dl class="stats" id="modalStats"></dl>
    <div id="modalChart"></div>
    <div class="duiding-text" id="modalDuiding"></div>
    <div class="modal-bron" id="modalBron"></div>
  </div>
</div>
<script>
function forecastSVG(historie, forecast) {
  const H = historie.map(p => ({ x: p.jaar, y: p.hoeveelheid_kton }));
  const F = forecast.map(p => ({ x: p.jaar, y: p.verwacht, lo: p.ondergrens, hi: p.bovengrens }));
  const pts = H.concat(F.map(p => ({ x: p.x, y: p.y })));
  if (pts.length < 2) return "<p style='font-size:12px;color:#8aa0b2'>Onvoldoende data voor een doorkijk.</p>";
  const W = 500, Hh = 160, pad = 30;
  const xs = pts.map(p => p.x), ys = pts.map(p => p.y).concat(F.map(p => p.hi));
  const xmin = Math.min(...xs), xmax = Math.max(...xs), ymin = 0, ymax = Math.max(...ys) * 1.1 || 1;
  const sx = x => pad + (x - xmin) / (xmax - xmin || 1) * (W - 2 * pad);
  const sy = y => Hh - pad - (y - ymin) / (ymax - ymin || 1) * (Hh - 2 * pad);
  const line = a => a.map((p, i) => `${i ? "L" : "M"}${sx(p.x).toFixed(1)},${sy(p.y).toFixed(1)}`).join(" ");
  let band = "";
  if (F.length) {
    const top = F.map(p => `${sx(p.x).toFixed(1)},${sy(p.hi).toFixed(1)}`);
    const bot = F.slice().reverse().map(p => `${sx(p.x).toFixed(1)},${sy(p.lo).toFixed(1)}`);
    band = `<polygon points="${top.concat(bot).join(" ")}" fill="#2ecc8f" opacity="0.12"/>`;
  }
  const fStart = H.length ? [H[H.length - 1], ...F] : F;
  const fLine = F.length ? line(fStart.map(p => ({ x: p.x, y: p.y }))) : "";
  return `<svg viewBox="0 0 ${W} ${Hh}" width="100%" style="margin-top:8px">
    ${band}
    <path d="${line(H)}" fill="none" stroke="#2ecc8f" stroke-width="2"/>
    <path d="${fLine}" fill="none" stroke="#2ecc8f" stroke-width="2" stroke-dasharray="5 4"/>
    <text x="${pad}" y="12" font-size="10" fill="#8aa0b2">kton — historie (doorgetrokken) + doorkijk (streep) tot ${xmax}</text>
  </svg>`;
}

const RAMP = ["#123a4f","#155e63","#1a9e78","#2ecc8f","#8affd0"];
let META = null;

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

const map = new maplibregl.Map({
  container: "map",
  style: "https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json",
  center: [5.3, 52.1], zoom: 6.3
});

function color(v, min, max) {
  if (v === null || v === undefined) return "#1a2634";
  const t = max > min ? (v - min) / (max - min) : 0;
  return RAMP[Math.min(RAMP.length - 1, Math.floor(t * RAMP.length))];
}

async function loadMeta() {
  META = await (await fetch("/api/afval/meta")).json();
  document.getElementById("bron").textContent = META.label + " — bron: " + META.bron;
  document.getElementById("licentie").textContent = "Licentie: " + META.licentie;
  const as = document.getElementById("afvalstroom");
  META.afvalstromen.forEach(a => as.add(new Option(a, a)));
  const jr = document.getElementById("jaar");
  META.jaren.slice().reverse().forEach(j => jr.add(new Option(j, j)));
  ["afvalstroom","jaar","indicator"].forEach(id =>
    document.getElementById(id).addEventListener("change", refresh));
  await refresh();
}

async function refresh() {
  const afvalstroom = document.getElementById("afvalstroom").value;
  const jaar = document.getElementById("jaar").value;
  const indicator = document.getElementById("indicator").value;
  const fc = await (await fetch(`/api/afval/choropleth?afvalstroom=${encodeURIComponent(afvalstroom)}&jaar=${jaar}&indicator=${indicator}`)).json();
  const vals = fc.features.map(f => f.properties.value).filter(v => v !== null);
  const min = Math.min(...vals), max = Math.max(...vals);
  fc.features.forEach(f => f.properties._fill = color(f.properties.value, min, max));
  const src = map.getSource("prov");
  if (src) src.setData(fc); else addLayer(fc);
  const eenheid = fc.features[0] ? fc.features[0].properties.eenheid : "";
  document.getElementById("legend").innerHTML =
    `<b>${indicator === "circulariteit" ? "Circulariteit" : esc(afvalstroom)} (${eenheid})</b><br>` +
    `<i style="background:${RAMP[0]}"></i>${isFinite(min)?min.toFixed(0):"–"} … ` +
    `<i style="background:${RAMP[4]}"></i>${isFinite(max)?max.toFixed(0):"–"}`;
}

function addLayer(fc) {
  map.addSource("prov", { type: "geojson", data: fc });
  map.addLayer({ id: "prov-fill", type: "fill", source: "prov",
    paint: { "fill-color": ["get","_fill"], "fill-opacity": 0.75, "fill-outline-color": "#fff" } });
  map.on("click", "prov-fill", e => showTrend(e.features[0].properties.identificatie,
                                             e.features[0].properties.naam));
  map.on("mouseenter", "prov-fill", () => map.getCanvas().style.cursor = "pointer");
  map.on("mouseleave", "prov-fill", () => map.getCanvas().style.cursor = "");
}

async function showTrend(code, naam) {
  const afvalstroom = document.getElementById("afvalstroom").value;
  const tr = await (await fetch(`/api/afval/trend?regio=${code}&afvalstroom=${encodeURIComponent(afvalstroom)}`)).json();
  let rows = tr.reeks.map(p =>
    `<tr><td>${p.jaar}</td><td>${p.hoeveelheid_kton.toFixed(0)}</td>` +
    `<td>${p.circulariteit_pct === null ? "–" : p.circulariteit_pct.toFixed(0)}</td></tr>`).join("");
  document.getElementById("trend").innerHTML =
    `<h3>${esc(naam)} — ${esc(afvalstroom)}</h3>` +
    `<table><thead><tr><th>Jaar</th><th>kton</th><th>circ.%</th></tr></thead><tbody>${rows}</tbody></table>` +
    `<button id="duidBtn">AI-duiding (uitgebreid)</button>`;
  document.getElementById("duidBtn").addEventListener("click",
    () => openDuiding(code, naam, afvalstroom));
}

const num = (v, d = 0) => (v === null || v === undefined) ? "–" : Number(v).toFixed(d);

function statsRows(c) {
  const r = [];
  const push = (k, v) => r.push(`<dt>${k}</dt><dd>${v}</dd>`);
  if (c.waarde_kton != null) push("Hoeveelheid", `${num(c.waarde_kton)} kton (${c.jaar})`);
  if (c.landelijk_gemiddelde_kton != null) {
    const pos = c.boven_gemiddeld == null ? "" : (c.boven_gemiddeld ? " · boven gemiddeld" : " · onder gemiddeld");
    const rang = c.rang ? ` · ${c.rang}e van ${c.aantal_provincies}` : "";
    push("Landelijk gem.", `${num(c.landelijk_gemiddelde_kton)} kton${rang}${pos}`);
  }
  if (c.aandeel_van_totaal_pct != null) push("Aandeel v/h totaal", `${num(c.aandeel_van_totaal_pct, 1)}%`);
  if (c.meerjaren && c.meerjaren.volume_pct != null) {
    const mj = c.meerjaren;
    const cp = mj.circ_pct_punt == null ? "" : `, circ. ${mj.circ_pct_punt >= 0 ? "+" : ""}${num(mj.circ_pct_punt)} pp`;
    push(`Trend ${mj.van_jaar}–${mj.tot_jaar}`, `volume ${mj.volume_pct >= 0 ? "+" : ""}${num(mj.volume_pct)}%${cp}`);
  }
  if (c.circulariteit_pct != null) push("Circulariteit", `${num(c.circulariteit_pct, 1)}% (${c.jaar})`);
  if (c.hoogste && c.laagste)
    push("Hoogste / laagste", `${esc(c.hoogste.naam)} (${num(c.hoogste.waarde_kton)}) · ${esc(c.laagste.naam)} (${num(c.laagste.waarde_kton)})`);
  if (c.achtergrond) push("Achtergrond", esc(c.achtergrond));
  return r.join("");
}

function closeModal() { document.getElementById("modal").hidden = true; }

async function openDuiding(code, naam, afvalstroom) {
  const jaar = document.getElementById("jaar").value;
  document.getElementById("modal").hidden = false;
  document.getElementById("modalTitle").textContent = `${naam} — ${afvalstroom}`;
  document.getElementById("modalSub").textContent = `Jaar ${jaar}`;
  document.getElementById("modalStats").innerHTML = "";
  document.getElementById("modalBron").textContent = "";
  const box = document.getElementById("modalDuiding");
  box.textContent = "Cijfers en AI-duiding ophalen…";
  let d;
  try {
    const r = await fetch("/api/afval/duiding", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ regio: code, afvalstroom, jaar: Number(jaar) })
    });
    if (!r.ok) { box.textContent = "Cijfers tijdelijk niet beschikbaar."; return; }
    d = await r.json();
  } catch (e) { box.textContent = "Cijfers tijdelijk niet beschikbaar."; return; }
  document.getElementById("modalStats").innerHTML = statsRows(d.context || {});
  // extra cijfers uit landelijke bronnen
  const extra = (d.context && d.context.extra) || {};
  let extraHtml = "";
  if (extra.recyclingpercentage != null)
    extraHtml += `<dt>Recycling (NL)</dt><dd>${num(extra.recyclingpercentage, 0)}% — ${esc(extra.recycling_bron || "")}</dd>`;
  if (extra.per_inwoner && extra.per_inwoner.length)
    extraHtml += `<dt>Per inwoner (NL)</dt><dd>${num(extra.per_inwoner[extra.per_inwoner.length - 1].waarde, 0)} kg</dd>`;
  if (extraHtml) document.getElementById("modalStats").innerHTML += extraHtml;
  // doorkijk-grafiek
  try {
    const f = await (await fetch(`/api/afval/forecast?regio=${encodeURIComponent(code)}&afvalstroom=${encodeURIComponent(afvalstroom)}`)).json();
    document.getElementById("modalChart").innerHTML =
      forecastSVG(f.historie || [], f.forecast || []) +
      `<div style="font-size:10px;color:#8aa0b2;margin-top:2px">${esc(f.label || "")}</div>`;
  } catch (e) { document.getElementById("modalChart").innerHTML = ""; }
  box.textContent = d.duiding || "AI-duiding tijdelijk niet beschikbaar — de cijfers hierboven komen rechtstreeks uit CBS.";
  document.getElementById("modalBron").textContent = `Bron: ${d.bron} — ${d.disclaimer}`;
}

document.getElementById("modalClose").addEventListener("click", closeModal);
document.getElementById("modal").addEventListener("click", e => {
  if (e.target.id === "modal") closeModal();
});
document.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });

async function laadBronnen() {
  const box = document.getElementById("bronnen");
  try {
    const bronnen = await (await fetch("/api/afval/bronnen")).json();
    box.innerHTML = "";
    bronnen.forEach(b => {
      const d = document.createElement("div");
      d.className = "bronitem";
      const naam = document.createElement("b"); naam.textContent = b.naam;
      const oms = document.createElement("div"); oms.textContent = b.omschrijving || "";
      const lic = document.createElement("div"); lic.className = "lic";
      lic.textContent = `Licentie: ${b.licentie} · ${b.type}`;
      d.appendChild(naam); d.appendChild(oms); d.appendChild(lic);
      if (b.url && /^https?:\/\//i.test(b.url)) {
        const a = document.createElement("a");
        a.href = b.url; a.target = "_blank"; a.rel = "noopener";
        a.textContent = "bron ↗"; a.style.fontSize = "11px";
        d.appendChild(a);
      }
      box.appendChild(d);
    });
  } catch (e) { box.textContent = "Brondata niet beschikbaar."; }
}

async function stelVraag() {
  const inp = document.getElementById("chatinput");
  const vraag = inp.value.trim();
  if (!vraag) return;
  const log = document.getElementById("chatlog");
  const q = document.createElement("div"); q.className = "q"; q.textContent = "▸ " + vraag;
  const a = document.createElement("div"); a.className = "a"; a.textContent = "denkt na…";
  log.appendChild(q); log.appendChild(a); log.scrollTop = log.scrollHeight;
  inp.value = "";
  try {
    const r = await fetch("/api/afval/chat", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ vraag })
    });
    const d = await r.json();
    a.textContent = d.antwoord || "Geen antwoord.";
    if (d.sql) {
      const det = document.createElement("details");
      const sum = document.createElement("summary"); sum.textContent = "toon query";
      const pre = document.createElement("pre"); pre.textContent = d.sql;
      det.appendChild(sum); det.appendChild(pre);
      log.insertBefore(det, a.nextSibling);
    }
    if (d.beschikbaar && d.bron) {
      const src = document.createElement("div");
      src.className = "lic"; src.style.fontSize = "11px";
      src.textContent = `${d.bron} — ${d.disclaimer || ""}`;
      log.appendChild(src);
    }
    if (!d.beschikbaar && d.vangnet) {
      const v = document.createElement("div"); v.className = "lic"; v.style.fontSize = "11px";
      v.textContent = d.vangnet; log.appendChild(v);
    }
  } catch (e) { a.textContent = "Chatbot tijdelijk niet beschikbaar."; }
  log.scrollTop = log.scrollHeight;
}

document.getElementById("chatsend").addEventListener("click", stelVraag);
document.getElementById("chatinput").addEventListener("keydown", e => { if (e.key === "Enter") stelVraag(); });
laadBronnen();
map.on("load", loadMeta);
</script>
</body>
</html>
