<!-- src/leefomgevinglab/static/afval.html -->
<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Afval &amp; circulariteit — LeefomgevingLab</title>
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
  body { margin: 0; font-family: system-ui, sans-serif; color: #1a1a1a; }
  header { padding: 12px 16px; background: #0b4f6c; color: #fff; }
  header h1 { margin: 0; font-size: 18px; }
  header p { margin: 4px 0 0; font-size: 12px; opacity: .85; }
  .wrap { display: flex; height: calc(100vh - 62px); }
  #map { flex: 1; }
  aside { width: 340px; padding: 14px; box-sizing: border-box; overflow-y: auto; border-left: 1px solid #ddd; }
  label { display: block; font-size: 12px; margin: 10px 0 3px; font-weight: 600; }
  select { width: 100%; padding: 6px; }
  .legend { margin-top: 12px; font-size: 12px; }
  .legend i { display: inline-block; width: 14px; height: 14px; margin-right: 6px; vertical-align: middle; }
  #trend { margin-top: 14px; }
  #trend h3 { font-size: 14px; margin: 8px 0; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th, td { border-bottom: 1px solid #eee; padding: 3px 4px; text-align: right; }
  th:first-child, td:first-child { text-align: left; }
  button { margin-top: 10px; padding: 8px 10px; background: #0b4f6c; color: #fff; border: 0; border-radius: 4px; cursor: pointer; }
  .bron { margin-top: 14px; font-size: 11px; color: #666; }
  #trend button { width: 100%; }

  /* Centrale AI-duiding-modal */
  .modal-overlay { position: fixed; inset: 0; background: rgba(8,32,44,.55);
    display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 20px; }
  .modal-overlay[hidden] { display: none; }
  .modal-card { background: #fff; border-radius: 12px; max-width: 560px; width: 100%;
    max-height: 88vh; overflow-y: auto; padding: 22px 24px; box-shadow: 0 18px 50px rgba(0,0,0,.35); position: relative; }
  .modal-card h2 { margin: 0 28px 4px 0; font-size: 19px; color: #0b4f6c; }
  .modal-card .sub { font-size: 12px; color: #789; margin-bottom: 14px; }
  .modal-close { position: absolute; top: 12px; right: 14px; background: none; color: #789;
    border: 0; font-size: 26px; line-height: 1; cursor: pointer; padding: 0; margin: 0; }
  .stats { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 13px; margin-bottom: 14px; }
  .stats dt { color: #567; font-weight: 600; }
  .stats dd { margin: 0; text-align: left; }
  .duiding-text { font-size: 14px; line-height: 1.5; background: #f3f7f9; border-left: 3px solid #0b4f6c;
    padding: 12px 14px; border-radius: 6px; white-space: pre-wrap; min-height: 40px; }
  .modal-bron { margin-top: 12px; font-size: 11px; color: #789; }
</style>
</head>
<body>
<header>
  <h1>Afval &amp; circulariteit per provincie</h1>
  <p id="bron">Laden…</p>
</header>
<div class="wrap">
  <div id="map"></div>
  <aside>
    <label>Afvalstroom</label>
    <select id="afvalstroom"></select>
    <label>Jaar</label>
    <select id="jaar"></select>
    <label>Indicator</label>
    <select id="indicator">
      <option value="volume">Hoeveelheid (kton)</option>
      <option value="circulariteit">Circulariteit (%)</option>
    </select>
    <div class="legend" id="legend"></div>
    <div id="trend"><h3>Klik op een provincie</h3></div>
    <div class="bron" id="licentie"></div>
  </aside>
</div>

<div id="modal" class="modal-overlay" hidden>
  <div class="modal-card">
    <button class="modal-close" id="modalClose" aria-label="Sluiten">&times;</button>
    <h2 id="modalTitle"></h2>
    <div class="sub" id="modalSub"></div>
    <dl class="stats" id="modalStats"></dl>
    <div class="duiding-text" id="modalDuiding"></div>
    <div class="modal-bron" id="modalBron"></div>
  </div>
</div>
<script>
const RAMP = ["#f7fbff","#c6dbef","#6baed6","#2171b5","#08306b"];
let META = null;

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

const map = new maplibregl.Map({
  container: "map",
  style: "https://basemaps.cartocdn.com/gl/positron-gl-style/style.json",
  center: [5.3, 52.1], zoom: 6.3
});

function color(v, min, max) {
  if (v === null || v === undefined) return "#e0e0e0";
  const t = max > min ? (v - min) / (max - min) : 0;
  return RAMP[Math.min(RAMP.length - 1, Math.floor(t * RAMP.length))];
}

async function loadMeta() {
  META = await (await fetch("/api/afval/meta")).json();
  document.getElementById("bron").textContent = META.label + " — bron: " + META.bron;
  document.getElementById("licentie").textContent = "Licentie: " + META.licentie;
  const as = document.getElementById("afvalstroom");
  META.afvalstromen.forEach(a => as.add(new Option(a, a)));
  const jr = document.getElementById("jaar");
  META.jaren.slice().reverse().forEach(j => jr.add(new Option(j, j)));
  ["afvalstroom","jaar","indicator"].forEach(id =>
    document.getElementById(id).addEventListener("change", refresh));
  await refresh();
}

async function refresh() {
  const afvalstroom = document.getElementById("afvalstroom").value;
  const jaar = document.getElementById("jaar").value;
  const indicator = document.getElementById("indicator").value;
  const fc = await (await fetch(`/api/afval/choropleth?afvalstroom=${encodeURIComponent(afvalstroom)}&jaar=${jaar}&indicator=${indicator}`)).json();
  const vals = fc.features.map(f => f.properties.value).filter(v => v !== null);
  const min = Math.min(...vals), max = Math.max(...vals);
  fc.features.forEach(f => f.properties._fill = color(f.properties.value, min, max));
  const src = map.getSource("prov");
  if (src) src.setData(fc); else addLayer(fc);
  const eenheid = fc.features[0] ? fc.features[0].properties.eenheid : "";
  document.getElementById("legend").innerHTML =
    `<b>${indicator === "circulariteit" ? "Circulariteit" : esc(afvalstroom)} (${eenheid})</b><br>` +
    `<i style="background:${RAMP[0]}"></i>${isFinite(min)?min.toFixed(0):"–"} … ` +
    `<i style="background:${RAMP[4]}"></i>${isFinite(max)?max.toFixed(0):"–"}`;
}

function addLayer(fc) {
  map.addSource("prov", { type: "geojson", data: fc });
  map.addLayer({ id: "prov-fill", type: "fill", source: "prov",
    paint: { "fill-color": ["get","_fill"], "fill-opacity": 0.75, "fill-outline-color": "#fff" } });
  map.on("click", "prov-fill", e => showTrend(e.features[0].properties.identificatie,
                                             e.features[0].properties.naam));
  map.on("mouseenter", "prov-fill", () => map.getCanvas().style.cursor = "pointer");
  map.on("mouseleave", "prov-fill", () => map.getCanvas().style.cursor = "");
}

async function showTrend(code, naam) {
  const afvalstroom = document.getElementById("afvalstroom").value;
  const tr = await (await fetch(`/api/afval/trend?regio=${code}&afvalstroom=${encodeURIComponent(afvalstroom)}`)).json();
  let rows = tr.reeks.map(p =>
    `<tr><td>${p.jaar}</td><td>${p.hoeveelheid_kton.toFixed(0)}</td>` +
    `<td>${p.circulariteit_pct === null ? "–" : p.circulariteit_pct.toFixed(0)}</td></tr>`).join("");
  document.getElementById("trend").innerHTML =
    `<h3>${esc(naam)} — ${esc(afvalstroom)}</h3>` +
    `<table><thead><tr><th>Jaar</th><th>kton</th><th>circ.%</th></tr></thead><tbody>${rows}</tbody></table>` +
    `<button id="duidBtn">AI-duiding (uitgebreid)</button>`;
  document.getElementById("duidBtn").addEventListener("click",
    () => openDuiding(code, naam, afvalstroom));
}

const num = (v, d = 0) => (v === null || v === undefined) ? "–" : Number(v).toFixed(d);

function statsRows(c) {
  const r = [];
  const push = (k, v) => r.push(`<dt>${k}</dt><dd>${v}</dd>`);
  if (c.waarde_kton != null) push("Hoeveelheid", `${num(c.waarde_kton)} kton (${c.jaar})`);
  if (c.landelijk_gemiddelde_kton != null) {
    const pos = c.boven_gemiddeld == null ? "" : (c.boven_gemiddeld ? " · boven gemiddeld" : " · onder gemiddeld");
    const rang = c.rang ? ` · ${c.rang}e van ${c.aantal_provincies}` : "";
    push("Landelijk gem.", `${num(c.landelijk_gemiddelde_kton)} kton${rang}${pos}`);
  }
  if (c.aandeel_van_totaal_pct != null) push("Aandeel v/h totaal", `${num(c.aandeel_van_totaal_pct, 1)}%`);
  if (c.meerjaren && c.meerjaren.volume_pct != null) {
    const mj = c.meerjaren;
    const cp = mj.circ_pct_punt == null ? "" : `, circ. ${mj.circ_pct_punt >= 0 ? "+" : ""}${num(mj.circ_pct_punt)} pp`;
    push(`Trend ${mj.van_jaar}–${mj.tot_jaar}`, `volume ${mj.volume_pct >= 0 ? "+" : ""}${num(mj.volume_pct)}%${cp}`);
  }
  if (c.circulariteit_pct != null) push("Circulariteit", `${num(c.circulariteit_pct, 1)}% (${c.jaar})`);
  if (c.hoogste && c.laagste)
    push("Hoogste / laagste", `${esc(c.hoogste.naam)} (${num(c.hoogste.waarde_kton)}) · ${esc(c.laagste.naam)} (${num(c.laagste.waarde_kton)})`);
  if (c.achtergrond) push("Achtergrond", esc(c.achtergrond));
  return r.join("");
}

function closeModal() { document.getElementById("modal").hidden = true; }

async function openDuiding(code, naam, afvalstroom) {
  const jaar = document.getElementById("jaar").value;
  document.getElementById("modal").hidden = false;
  document.getElementById("modalTitle").textContent = `${naam} — ${afvalstroom}`;
  document.getElementById("modalSub").textContent = `Jaar ${jaar}`;
  document.getElementById("modalStats").innerHTML = "";
  document.getElementById("modalBron").textContent = "";
  const box = document.getElementById("modalDuiding");
  box.textContent = "Cijfers en AI-duiding ophalen…";
  let d;
  try {
    const r = await fetch("/api/afval/duiding", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ regio: code, afvalstroom, jaar: Number(jaar) })
    });
    if (!r.ok) { box.textContent = "Cijfers tijdelijk niet beschikbaar."; return; }
    d = await r.json();
  } catch (e) { box.textContent = "Cijfers tijdelijk niet beschikbaar."; return; }
  document.getElementById("modalStats").innerHTML = statsRows(d.context || {});
  box.textContent = d.duiding || "AI-duiding tijdelijk niet beschikbaar — de cijfers hierboven komen rechtstreeks uit CBS.";
  document.getElementById("modalBron").textContent = `Bron: ${d.bron} — ${d.disclaimer}`;
}

document.getElementById("modalClose").addEventListener("click", closeModal);
document.getElementById("modal").addEventListener("click", e => {
  if (e.target.id === "modal") closeModal();
});
document.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });

map.on("load", loadMeta);
</script>
</body>
</html>
